name: Patch Toys
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: |
          python3 - <<'PY'
          import sys
          p='app/src/main/assets/pet/index.html'
          s=open(p,encoding='utf-8').read()
          if 'PetToys' in s:
              print('already patched')
              sys.exit(0)
          R=[
          (r'''!(window.PetFx&&PetFx.busy())''',
           r'''!(window.PetFx&&PetFx.busy())&&!(window.PetToys&&PetToys.busy())''',2),
          (r'''else idleRoutine();''',
           r'''else if(!(window.PetToys&&PetToys.idle()))idleRoutine();''',1),
          (r'''if(window.PetFx)PetFx.frame(dt);''',
           r'''if(window.PetFx)PetFx.frame(dt);if(window.PetToys)PetToys.frame(dt);''',1),
          (r'''set happy(v){happyTill=clock+v}};''',
           r'''set happy(v){happyTill=clock+v},inRoutine,get anim(){return anim},get pd(){return pd}};''',1),
          ('<script src="fx.js"></script>',
           '<script src="fx.js"></script>\n<script src="toys.js"></script>',1),
          ]
          for o,n,k in R:
              c=s.count(o)
              if c!=k:
                  print('FAILED, count=%d: %s' % (c,o[:80]))
                  sys.exit(1)
              s=s.replace(o,n)
          open(p,'w',encoding='utf-8').write(s)
          print('patched ok')
          PY
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/src/main/assets/pet/index.html
          git diff --cached --quiet && echo "nothing to commit" || (git commit -m "pet: hook toys.js" && git push)
