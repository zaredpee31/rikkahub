name: Patch Pet Tool
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: |
          python3 - <<'PY'
          import os,re,sys
          root='app/src/main/java'
          skip=('JadeTools.kt','PetTools.kt')
          files=[]
          for dp,_,fs in os.walk(root):
              for f in fs:
                  if f.endswith('.kt') and f not in skip:
                      files.append(os.path.join(dp,f))
          for p in files:
              if 'createPetTools' in open(p,encoding='utf-8').read():
                  print('already patched: '+p)
                  sys.exit(0)
          pat=re.compile(r'((?:[A-Za-z_]\w*\.)*)createJadeTools\(([^()]*)\)')
          total=0
          for p in files:
              s=open(p,encoding='utf-8').read()
              if 'createJadeTools(' not in s:
                  continue
              def rep(m):
                  q,a=m.group(1),m.group(2)
                  return '(%screateJadeTools(%s) + me.rerere.rikkahub.data.ai.tools.createPetTools(%s))'%(q,a,a)
              s2,c=pat.subn(rep,s)
              if c==0:
                  print('FAILED, cannot parse call in '+p)
                  sys.exit(1)
              open(p,'w',encoding='utf-8').write(s2)
              print('patched %s x%d'%(p,c))
              total+=c
          if total==0:
              print('FAILED, no createJadeTools call found')
              sys.exit(1)
          PY
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A app/src/main/java
          git diff --cached --quiet && echo "nothing to commit" || (git commit -m "pet: chat tool" && git push)
