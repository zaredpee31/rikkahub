name: Find Clawd

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/find-clawd.yml'

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find
        run: |
          {
            echo "## ChatPage.kt 第 470 到 530 行"
            echo '```'
            sed -n '470,530p' app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatPage.kt
            echo '```'
            echo "## ClawdPet 的参数"
            echo '```'
            sed -n '155,200p' app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ClawdPet.kt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
