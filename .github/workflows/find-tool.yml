name: Find Tool
on:
  workflow_dispatch:
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dump
        run: |
          J=app/src/main/java
          {
            echo "## files with jade_shop"
            echo '~~~'
            FILES=$(grep -rl "jade_shop" $J || true)
            for f in $FILES; do echo "$f $(wc -l < $f)"; done
            echo '~~~'
            for f in $FILES; do
              n=$(wc -l < "$f")
              echo ""
              echo "### $f"
              echo '~~~kotlin'
              if [ "$n" -le 400 ]; then
                cat "$f"
              else
                head -40 "$f"
                echo "......"
                grep -n -B8 -A70 "jade_shop" "$f" | head -200
              fi
              echo '~~~'
            done
            echo ""
            echo "## who uses PetGame / JadeShop"
            echo '~~~'
            grep -rnE "PetGame\.|CLAUDE\s*=|MOM\s*=|JadeShop[A-Za-z]*\(" $J | head -40 || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
