name: Build Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ master, feature/companion-messages ]
# 连着提交好几次时，只打最新那次
concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # 第一次要把签名存回仓库，需要写权限
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 把子模块也一起下载下来
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # 固定签名：仓库里有就用仓库里的，没有就生成一个存回仓库
      - name: Fixed debug keystore
        run: |
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          if [ -f app/debug.keystore ]; then
            cp app/debug.keystore ~/.android/debug.keystore
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore app/debug.keystore
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -f app/debug.keystore
            git commit -m "保存固定的 debug 签名"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Companion server regression tests
        run: |
          python3 -m pip install -r companion-server/requirements.txt
          python3 -m unittest discover -s companion-server -v
      - uses: gradle/actions/setup-gradle@v4
      # 网页部分要用 pnpm 打包，先装 Node 和 pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm@10
      # 下载网页部分的依赖包
      - name: Install web-ui deps
        working-directory: web-ui
        run: pnpm install --no-frozen-lockfile
      # 仓库里没有 Firebase 配置的话，放一个假的，不然打包会报错
      - name: Dummy google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "me.rerere.rikkahub.debug" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "dummy" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
      # 打包失败时，把报错那几行写进 Annotations，手机上不用点开日志也能看到
      - name: Memory unit tests
        run: |
          chmod +x gradlew
          set -o pipefail
          if ./gradlew :app:testGithubDebugUnitTest --tests 'me.rerere.rikkahub.data.repository.LegacyMemoryParserTest' --tests 'me.rerere.rikkahub.data.repository.MemoryRepositoryTest' --tests 'me.rerere.rikkahub.data.model.MemoryFileTest' --tests 'me.rerere.rikkahub.data.repository.PendingIdsTest' --tests 'me.rerere.rikkahub.data.db.Migration32To33SchemaTest' --stacktrace 2>&1 | tee test.log; then
            exit 0
          fi
          # 失败原因写成注解，不登录也能从公开接口看到
          { grep -E '^e: |FAILED|Exception|expected|What went wrong|Task .* not found' test.log | sed -E 's#file://[^ ]*/me/rerere/##' | head -n 25; for x in app/build/test-results/*/*.xml; do grep -h -A3 '<failure' "$x" 2>/dev/null | head -n 12; done; } | while IFS= read -r line; do
            line="${line//%/%25}"
            echo "::error::$line"
          done
          exit 1

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          if ./gradlew assembleGithubDebug --stacktrace 2>&1 | tee build.log; then
            exit 0
          fi
          errors=$(grep -E '^e: ' build.log | sed -E 's#file://[^ ]*/java/me/rerere/##' | head -n 10 || true)
          if [ -z "$errors" ]; then
            errors=$(grep -A 10 'What went wrong' build.log | grep -v '^\s*$' | head -n 10 || true)
          fi
          if [ -z "$errors" ]; then
            errors=$(tail -n 10 build.log || true)
          fi
          printf '%s\n' "$errors" | while IFS= read -r line; do
            line="${line//%/%25}"
            echo "::error::$line"
          done
          exit 1
      # 只上传荣耀手机用的 arm64 包，另外两个不要
      - uses: actions/upload-artifact@v4
        with:
          name: rikkahub-debug
          path: app/build/outputs/apk/github/debug/*arm64-v8a*.apk
          if-no-files-found: error
      # Room 编译时导出的数据库结构文件（schemas/*.json）有新的就存回仓库，迁移测试和以后的升级都要用
      - name: Save exported Room schema
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add app/schemas
            git commit -m "保存 Room 导出的数据库结构"
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
          fi
