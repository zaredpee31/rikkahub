name: Build Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ master ]
# 连着提交好几次时，只打最新那次
concurrency:
  group: debug-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # 第一次要把签名存回仓库，需要写权限
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 把子模块也一起下载下来
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # 固定签名：仓库里有就用仓库里的，没有就生成一个存回仓库
      - name: Fixed debug keystore
        run: |
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          if [ -f app/debug.keystore ]; then
            cp app/debug.keystore ~/.android/debug.keystore
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore app/debug.keystore
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -f app/debug.keystore
            git commit -m "保存固定的 debug 签名"
            git push origin HEAD:master
          fi
      - uses: gradle/actions/setup-gradle@v4
      # 网页部分要用 pnpm 打包，先装 Node 和 pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm@10
      # 下载网页部分的依赖包
      - name: Install web-ui deps
        working-directory: web-ui
        run: pnpm install --no-frozen-lockfile
      # 仓库里没有 Firebase 配置的话，放一个假的，不然打包会报错
      - name: Dummy google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "me.rerere.rikkahub.debug" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "dummy" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rikkahub-debug
          path: app/build/outputs/apk/github/debug/*.apk
