name: Patch Pet
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: |
          python3 - <<'PY'
          import sys
          p='app/src/main/assets/pet/index.html'
          s=open(p,encoding='utf-8').read()
          if 'PetFx' in s:
              print('already patched')
              sys.exit(0)
          R=[
          (r'''s.yaw=dist>.05?Math.atan2(dx,dz):baseYaw''',
           r'''s.yaw=dist>.05?(window.PetFx?PetFx.crab(Math.atan2(dx,dz)):Math.atan2(dx,dz)):baseYaw'''),
          (r'''lift.vy-=12*dt;P.y+=lift.vy*dt;''',
           r'''lift.vy-=12*dt;P.y+=lift.vy*dt;if(lift.vx){P.x+=lift.vx*dt;if(Math.abs(P.x)>2.4){P.x=clamp(P.x,-2.4,2.4);lift.vx*=-.5}}'''),
          (r'''if(P.y<=0){P.y=0;lift=null;play('land',.45);say(pick(L.land));routine([{t:'wait',d:1.2},{t:'walk',x:0,z:0},{t:'face',yaw:0}])}''',
           r'''if(P.y<=0){P.y=0;const fx=window.PetFx?PetFx.land(lift):'';if(fx!=='bounce'){lift=null;if(fx==='hard'){play('dizzy',2);say(pick(L.dizzy));routine([{t:'wait',d:2.4},{t:'walk',x:0,z:0},{t:'face',yaw:0}])}else if(fx!=='tub'){play('land',.45);say(pick(L.land));routine([{t:'wait',d:1.2},{t:'walk',x:0,z:0},{t:'face',yaw:0}])}}}'''),
          (r'''if(!S.out&&!S.sleeping&&!anim&&!inRoutine()&&!lift&&!dragFood&&!rubbing&&!pd&&clock>nextIdle){''',
           r'''if(!S.out&&!S.sleeping&&!anim&&!inRoutine()&&!lift&&!dragFood&&!rubbing&&!pd&&!(window.PetFx&&PetFx.busy())&&clock>nextIdle){'''),
          (r'''if(!S.out&&!asleep&&!S.sleeping&&clock>nextChat){''',
           r'''if(!S.out&&!asleep&&!S.sleeping&&!(window.PetFx&&PetFx.busy())&&clock>nextChat){'''),
          (r'''if(lift&&!lift.fall){lift.fall=true;lift.vy=0}''',
           r'''if(lift&&!lift.fall){lift.fall=true;lift.vy=0;if(window.PetFx)PetFx.release(lift)}'''),
          (r'''updatePet(dt);updateParts(dt);''',
           r'''updatePet(dt);if(window.PetFx)PetFx.frame(dt);updateParts(dt);'''),
          (r'''window.PetApp={THREE,R,act,toast,say,setMode,render,refresh,openSheet,closeSheet,esc,rbox,CAT,get S(){return S},get mode(){return mode}};''',
           r'''window.PetApp={THREE,R,act,toast,say,setMode,render,refresh,openSheet,closeSheet,esc,rbox,CAT,get S(){return S},get mode(){return mode},scene,cam,pet,root,body,P,M,mesh,emit,hearts,play,routine,stopRoutine,busy,setEyes,L,get lift(){return lift},get walking(){return walking},get clock(){return clock},get onBed(){return onBed},get dragFood(){return dragFood},set happy(v){happyTill=clock+v}};'''),
          ('<script src="map.js"></script>',
           '<script src="map.js"></script>\n<script src="fx.js"></script>'),
          ]
          for o,n in R:
              c=s.count(o)
              if c!=1:
                  print('FAILED, count=%d: %s' % (c,o[:80]))
                  sys.exit(1)
              s=s.replace(o,n)
          open(p,'w',encoding='utf-8').write(s)
          print('patched ok')
          PY
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/src/main/assets/pet/index.html
          git diff --cached --quiet && echo "nothing to commit" || (git commit -m "pet: hook fx.js" && git push)
