name: Find Pet
on:
  workflow_dispatch:
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dump
        run: |
          A=app/src/main/assets/pet
          PG=app/src/main/java/me/rerere/rikkahub/pet/PetGame.kt
          {
            echo "## three version"
            echo '~~~'
            grep -oE '"use strict";const [A-Za-z_$]+="[0-9]+"' $A/three.min.js | head -1 || true
            head -c 200 $A/three.min.js
            echo ""
            echo '~~~'
            echo ""
            echo "## PetGame.kt act + view + perform"
            echo '~~~kotlin'
            sed -n '140,170p;283,300p;450,601p' "$PG"
            echo '~~~'
            echo ""
            echo "## map.js"
            echo '~~~js'
            cat $A/map.js
            echo '~~~'
            echo ""
            echo "## index.html"
            echo '~~~html'
            cat $A/index.html
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
