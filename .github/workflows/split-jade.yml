name: Split jade page
on:
  workflow_dispatch:
jobs:
  split:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Split
        run: |
          curl -fsSL https://raw.githubusercontent.com/hual66209-max/dushi-xiaopu/main/index.html -o orig.html
          rm -rf jade-src
          mkdir jade-src
          awk -v max=40000 '
            BEGIN { n = 1; size = 0; f = "jade-src/part1.txt" }
            {
              line = $0
              if (length(line) > 20000) line = "<!-- 这一行很长（" length($0) " 字），是 3D 库，已省略 -->"
              line = "[" NR "] " line
              if (size > 0 && size + length(line) > max) { close(f); n++; size = 0; f = "jade-src/part" n ".txt" }
              print line > f
              size += length(line) + 1
            }' orig.html
          ls jade-src >> $GITHUB_STEP_SUMMARY
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add jade-src
          git commit -m "拆分赌石页面代码" || echo "没有变化"
          git push origin HEAD:master
